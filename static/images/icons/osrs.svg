<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="32" height="32" shape-rendering="crispEdges">
  <!-- Back stack of coins -->
  <rect x="2" y="3" width="6" height="1" fill="#6b4e05"/>
  <rect x="1" y="4" width="8" height="10" fill="#6b4e05"/>
  <rect x="2" y="4" width="6" height="1" fill="#ffe24d"/>
  <rect x="3" y="4" width="1" height="1" fill="#fff6b0"/>
  <g fill="#d9a520">
    <rect x="2" y="5" width="6" height="1"/><rect x="2" y="7" width="6" height="1"/>
    <rect x="2" y="9" width="6" height="1"/><rect x="2" y="11" width="6" height="1"/>
    <rect x="2" y="13" width="6" height="1"/>
  </g>
  <g fill="#a67c12">
    <rect x="2" y="6" width="6" height="1"/><rect x="2" y="8" width="6" height="1"/>
    <rect x="2" y="10" width="6" height="1"/><rect x="2" y="12" width="6" height="1"/>
  </g>
  <rect x="2" y="14" width="6" height="1" fill="#6b4e05"/>
  <!-- Front stack of coins -->
  <rect x="8" y="7" width="6" height="1" fill="#6b4e05"/>
  <rect x="7" y="8" width="8" height="6" fill="#6b4e05"/>
  <rect x="8" y="8" width="6" height="1" fill="#ffe24d"/>
  <rect x="9" y="8" width="1" height="1" fill="#fff6b0"/>
  <g fill="#d9a520">
    <rect x="8" y="9" width="6" height="1"/><rect x="8" y="11" width="6" height="1"/>
    <rect x="8" y="13" width="6" height="1"/>
  </g>
  <g fill="#a67c12">
    <rect x="8" y="10" width="6" height="1"/><rect x="8" y="12" width="6" height="1"/>
  </g>
  <rect x="8" y="14" width="6" height="1" fill="#6b4e05"/>
  <!-- Sparkle -->
  <rect x="12" y="4" width="1" height="3" fill="#ffffff"/>
  <rect x="11" y="5" width="3" height="1" fill="#ffffff"/>
</svg>
